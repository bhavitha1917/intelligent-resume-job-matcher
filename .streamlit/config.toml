[theme]
base = "light"
primaryColor = "#4C72B0"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
# Resumes are small; a low limit protects the free-tier host.
maxUploadSize = 10
# Serves app/static/ (app icon) at /app/static/.
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
